# =============================================================================
# Deploy Taatom backend to AWS EC2 (Docker Compose + health check + rollback)
# Triggers on push to main when backend/ or this workflow changes.
#
# Server layout (EC2):
#   /home/ubuntu/TeamTaatom          ← git clone of monorepo
#   /home/ubuntu/TeamTaatom/backend  ← docker compose + .env
#
# Compose starts Redis on the private Docker network (service name "redis").
# After the API /health check passes, the job also requires
# GET /health/detailed to report services.redis.status = healthy.
# A failed Redis check rolls the API image back.
#
# After every deploy attempt (success, failure, or rollback) the server emails
# a report through the Brevo key already in backend/.env. Recipients default to
# kkavinkumar24@gmail.com,admin@taatom.com. To add people later, set the GitHub
# repository variable DEPLOY_NOTIFY_EMAILS to a comma-separated list. That
# variable replaces the default. If it is empty, backend/.env DEPLOY_NOTIFY_EMAILS
# is used, then the built-in list.
#
# SSH: store EC2_SSH_KEY as base64 of the PEM (avoids GitHub newline mangling).
#   base64 -i your-key.pem | pbcopy   # macOS
#   base64 -w0 your-key.pem           # Linux
# EC2_HOST must be the PUBLIC IPv4 / Elastic IP (not 172.31.x.x).
# =============================================================================

name: Deploy Backend (EC2)

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

concurrency:
  group: deploy-backend-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build & deploy on EC2
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare SSH private key
        env:
          EC2_SSH_KEY_B64: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          if [ -z "${EC2_SSH_KEY_B64:-}" ]; then
            echo "ERROR: EC2_SSH_KEY secret is empty."
            exit 1
          fi

          # Accept either base64-encoded PEM (preferred) or raw PEM.
          # Strip accidental quotes from GitHub secret paste.
          KEY="$(printf '%s' "$EC2_SSH_KEY_B64" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's/^"//' -e 's/"$//' -e "s/^'//" -e "s/'$//")"

          if printf '%s' "$KEY" | grep -Eq 'BEGIN (RSA |OPENSSH )?PRIVATE KEY'; then
            printf '%s\n' "$KEY" > ~/.ssh/ec2.pem
          else
            CLEAN="$(printf '%s' "$KEY" | tr -d '[:space:]')"
            if [ -z "$CLEAN" ]; then
              echo "ERROR: EC2_SSH_KEY is empty after trimming."
              exit 1
            fi
            if ! printf '%s' "$CLEAN" | grep -Eq '^[A-Za-z0-9+/=]+$'; then
              echo "ERROR: EC2_SSH_KEY is neither raw PEM nor valid base64."
              echo "Re-encode on macOS and paste ONLY the clipboard into the secret (no quotes):"
              echo "  base64 -i /path/to/new-tatoom-keys.pem | tr -d '\\n' | pbcopy"
              exit 1
            fi
            if ! printf '%s' "$CLEAN" | base64 -d > ~/.ssh/ec2.pem 2>/tmp/b64.err; then
              echo "ERROR: base64 decode failed for EC2_SSH_KEY."
              cat /tmp/b64.err || true
              echo "Secret length (chars): ${#CLEAN}"
              echo "Re-encode on macOS and paste ONLY the clipboard into the secret (no quotes):"
              echo "  base64 -i /path/to/new-tatoom-keys.pem | tr -d '\\n' | pbcopy"
              exit 1
            fi
          fi
          chmod 600 ~/.ssh/ec2.pem

          if ! ssh-keygen -y -f ~/.ssh/ec2.pem >/dev/null 2>&1; then
            echo "ERROR: EC2_SSH_KEY is not a valid private key after decode."
            echo "Encode the PEM on your machine and update the secret:"
            echo "  macOS:  base64 -i your-key.pem | tr -d '\\n' | pbcopy"
            echo "  Linux:  base64 -w0 your-key.pem"
            exit 1
          fi
          echo "SSH private key OK"

      - name: Preflight — TCP reachability from Actions runner
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_PORT: ${{ secrets.EC2_SSH_PORT }}
        run: |
          set -euo pipefail
          HOST="$(printf '%s' "$EC2_HOST" | tr -d '[:space:]')"
          PORT="$(printf '%s' "${EC2_SSH_PORT:-22}" | tr -d '[:space:]')"
          if [ -z "$PORT" ]; then PORT=22; fi

          echo "Host length: ${#HOST}"
          echo "Port: $PORT"
          echo "Host prefix: ${HOST:0:3}..."

          case "$HOST" in
            10.*|192.168.*|172.1[6-9].*|172.2[0-9].*|172.3[0-1].*)
              echo "ERROR: EC2_HOST looks like a private RFC1918 address."
              echo "GitHub Actions cannot reach private IPs. Use the Public IPv4 / Elastic IP."
              exit 1
              ;;
          esac

          echo "Probing TCP ${HOST}:${PORT} from this runner..."
          if ! timeout 10 bash -c "echo >/dev/tcp/${HOST}/${PORT}"; then
            echo "ERROR: TCP connect timed out from GitHub Actions → ${HOST}:${PORT}"
            echo ""
            echo "Your Mac can reach the server, but Actions uses different source IPs."
            echo "Fix AWS Security Group inbound SSH (22):"
            echo "  Source must be 0.0.0.0/0  (NOT 'My IP' only)"
            echo "Also confirm EC2_HOST is exactly the public IP (no spaces/quotes)."
            exit 1
          fi
          echo "TCP reachability OK from Actions runner"

      - name: Pack deploy report mailer
        run: |
          set -euo pipefail
          test -f backend/scripts/send-deploy-report.py
          B64="$(base64 -w0 backend/scripts/send-deploy-report.py)"
          echo "DEPLOY_MAILER_B64=${B64}" >> "$GITHUB_ENV"

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          REPO_PATH: ${{ secrets.EC2_REPO_PATH }}
          BACKEND_PATH: ${{ secrets.EC2_BACKEND_PATH }}
          HEALTH_URL: ${{ secrets.BACKEND_HEALTH_URL }}
          DEPLOY_MAILER_B64: ${{ env.DEPLOY_MAILER_B64 }}
          DEPLOY_NOTIFY_EMAILS: ${{ vars.DEPLOY_NOTIFY_EMAILS }}
          GH_ACTOR: ${{ github.actor }}
          GH_SHA: ${{ github.sha }}
          GH_REF: ${{ github.ref_name }}
          GH_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GH_EVENT: ${{ github.event_name }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key_path: /home/runner/.ssh/ec2.pem
          port: 22
          timeout: 60s
          envs: REPO_PATH,BACKEND_PATH,HEALTH_URL,DEPLOY_MAILER_B64,DEPLOY_NOTIFY_EMAILS,GH_ACTOR,GH_SHA,GH_REF,GH_RUN_URL,GH_EVENT
          script_stop: false
          command_timeout: 25m
          script: |
            set -euo pipefail

            # Trim whitespace from secrets (trailing spaces break cd)
            REPO_PATH="$(printf '%s' "${REPO_PATH:-/home/ubuntu/TeamTaatom}" | tr -d '[:space:]')"
            BACKEND_PATH="$(printf '%s' "${BACKEND_PATH:-}" | tr -d '[:space:]')"
            HEALTH_URL="$(printf '%s' "${HEALTH_URL:-http://127.0.0.1:3000/health}" | tr -d '[:space:]')"

            if [ -z "$BACKEND_PATH" ]; then
              BACKEND_PATH="$REPO_PATH/backend"
            fi

            echo "REPO_PATH=$REPO_PATH"
            echo "BACKEND_PATH=$BACKEND_PATH"
            echo "HEALTH_URL=$HEALTH_URL"

            DEPLOY_RESULT="failed"
            DEPLOY_REASON="Deploy stopped before it finished"
            PREV_SHA=""
            NEW_SHA=""
            MAILER=/tmp/taatom-send-deploy-report.py
            if [ -n "${DEPLOY_MAILER_B64:-}" ]; then
              printf '%s' "$DEPLOY_MAILER_B64" | base64 -d > "$MAILER" || echo "WARNING: could not decode deploy mailer"
            else
              echo "WARNING: deploy mailer was not packed; email will be skipped"
            fi
            send_deploy_mail() {
              local code=$?
              trap - EXIT
              if [ -f "$MAILER" ]; then
                python3 "$MAILER" \
                  --status "$DEPLOY_RESULT" \
                  --reason "$DEPLOY_REASON" \
                  --prev-sha "${PREV_SHA:-}" \
                  --new-sha "${NEW_SHA:-}" \
                  --intended-sha "${GH_SHA:-}" \
                  --repo "${REPO_PATH:-}" \
                  --backend "${BACKEND_PATH:-}" \
                  --health-url "${HEALTH_URL:-}" \
                  --actor "${GH_ACTOR:-}" \
                  --ref "${GH_REF:-}" \
                  --run-url "${GH_RUN_URL:-}" \
                  --event "${GH_EVENT:-}" \
                  --emails "${DEPLOY_NOTIFY_EMAILS:-}" \
                  || echo "WARNING: deploy email was not sent"
              fi
              exit "$code"
            }
            trap send_deploy_mail EXIT

            if [ ! -d "$REPO_PATH" ]; then
              echo "ERROR: REPO_PATH does not exist: [$REPO_PATH]"
              echo "Set EC2_REPO_PATH secret to: /home/ubuntu/TeamTaatom"
              ls -la /home/ubuntu/TeamTaatom || true
              DEPLOY_REASON="Server repository path does not exist"
              exit 1
            fi

            cd "$REPO_PATH"

            echo "==> Recording rollback point"
            PREV_SHA="$(git rev-parse HEAD)"
            PREV_IMAGE_ID="$(docker images -q taatom-backend:latest 2>/dev/null || true)"
            if [ -n "$PREV_IMAGE_ID" ]; then
              docker tag taatom-backend:latest "taatom-backend:rollback-${PREV_SHA}" || true
            fi

            echo "==> Fetching latest main"
            git fetch origin main
            git checkout main
            git reset --hard origin/main
            NEW_SHA="$(git rev-parse HEAD)"

            if [ ! -d "$BACKEND_PATH" ]; then
              echo "ERROR: BACKEND_PATH does not exist: [$BACKEND_PATH]"
              echo "Set EC2_BACKEND_PATH secret to: /home/ubuntu/taatom/TeamTaatom/backend"
              echo "Contents of repo root:"
              ls -la "$REPO_PATH"
              DEPLOY_REASON="Backend directory does not exist on the server"
              exit 1
            fi

            cd "$BACKEND_PATH"

            if [ ! -f .env ]; then
              echo "ERROR: $BACKEND_PATH/.env is missing. Create it from .env.example before deploying."
              DEPLOY_REASON="backend/.env is missing on the server"
              exit 1
            fi

            echo "==> Building image"
            docker compose build

            echo "==> Freeing port 3000 (legacy containers)"
            # Old EC2 used container name teamtatoom on 0.0.0.0:3000 — conflicts with taatom-backend
            for c in teamtatoom cool_chaum; do
              docker rm -f "$c" 2>/dev/null || true
            done
            # If something else still holds :3000, remove containers publishing that port
            while read -r cid; do
              [ -n "$cid" ] || continue
              name="$(docker inspect -f '{{.Name}}' "$cid" 2>/dev/null | sed 's#^/##')"
              if [ "$name" != "taatom-backend" ]; then
                echo "Removing port-3000 container: $name ($cid)"
                docker rm -f "$cid" 2>/dev/null || true
              fi
            done < <(docker ps -q --filter publish=3000 2>/dev/null || true)

            echo "==> Restarting stack"
            docker compose up -d --remove-orphans --force-recreate

            echo "==> Waiting for health: $HEALTH_URL"
            OK=0
            for i in $(seq 1 30); do
              if curl -fsS "$HEALTH_URL" >/dev/null 2>&1; then
                OK=1
                break
              fi
              echo "  attempt $i/30 — not ready yet"
              sleep 5
            done

            if [ "$OK" -ne 1 ]; then
              echo "==> Health check FAILED — rolling back to $PREV_SHA"
              cd "$REPO_PATH"
              git reset --hard "$PREV_SHA"
              cd "$BACKEND_PATH"
              if docker image inspect "taatom-backend:rollback-${PREV_SHA}" >/dev/null 2>&1; then
                docker tag "taatom-backend:rollback-${PREV_SHA}" taatom-backend:latest
                docker compose up -d --no-build --remove-orphans
              else
                docker compose up -d --build --remove-orphans
              fi

              sleep 10
              if curl -fsS "$HEALTH_URL" >/dev/null 2>&1; then
                echo "Rollback container is healthy; failing the workflow."
                DEPLOY_RESULT="rolled_back"
                DEPLOY_REASON="API /health did not pass. Rollback is healthy on the previous version."
              else
                echo "CRITICAL: rollback health check also failed. Manual intervention required."
                DEPLOY_RESULT="failed"
                DEPLOY_REASON="API /health did not pass, and the rollback health check also failed. The server needs a manual check."
              fi
              exit 1
            fi

            echo "==> Checking Redis on ${HEALTH_URL}/detailed"
            DETAIL_URL="${HEALTH_URL}/detailed"
            REDIS_OK=0
            for i in $(seq 1 12); do
              if python3 -c 'import json,sys,urllib.request; url=sys.argv[1]; body=json.load(urllib.request.urlopen(url, timeout=10)); redis=((body.get("data") or {}).get("services") or {}).get("redis") or {}; status=redis.get("status"); print("redis status=%s responseTimeMs=%s" % (status, redis.get("responseTimeMs"))); sys.exit(0 if status=="healthy" else 1)' "$DETAIL_URL"; then
                REDIS_OK=1
                break
              fi
              echo "  redis attempt $i/12 — not healthy yet"
              sleep 5
            done

            if [ "$REDIS_OK" -ne 1 ]; then
              echo "==> Redis health check FAILED — rolling back to $PREV_SHA"
              cd "$REPO_PATH"
              git reset --hard "$PREV_SHA"
              cd "$BACKEND_PATH"
              if docker image inspect "taatom-backend:rollback-${PREV_SHA}" >/dev/null 2>&1; then
                docker tag "taatom-backend:rollback-${PREV_SHA}" taatom-backend:latest
                docker compose up -d --no-build --remove-orphans
              else
                docker compose up -d --build --remove-orphans
              fi
              echo "Rollback started because Redis was not healthy after deploy."
              DEPLOY_RESULT="rolled_back"
              DEPLOY_REASON="Redis was not healthy on /health/detailed. The previous image was restored."
              exit 1
            fi

            DEPLOY_RESULT="success"
            DEPLOY_REASON="API and Redis are healthy"
            echo "==> Deploy healthy (API and Redis)"
            curl -fsS "$HEALTH_URL" >/dev/null || true
            curl -fsS "$DETAIL_URL" >/dev/null || true
            docker compose ps
            docker image prune -f >/dev/null 2>&1 || true
